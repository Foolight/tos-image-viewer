<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火山引擎图片浏览器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 12px;
            text-align: center;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .info-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header .info {
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #555;
        }

        .page-size-selector label {
            font-weight: 500;
            white-space: nowrap;
        }

        .page-size-selector input {
            width: 70px;
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s;
        }

        .page-size-selector input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .container {
            max-width: 1600px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        .spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 5px solid rgba(102, 126, 234, 0.1);
            border-top: 5px solid #667eea;
            border-right: 5px solid #764ba2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #e74c3c;
            font-size: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.1);
            margin: 20px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }

        .image-item {
            position: relative;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .image-item:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
        }

        .image-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }

        .image-item:hover::before {
            opacity: 1;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 0;
        }

        .image-item .image-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 80%, transparent 100%);
            color: #fff;
            padding: 12px 10px 10px;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2;
            font-weight: 500;
        }

        .image-item:hover .image-name {
            opacity: 1;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: #fff;
            color: #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination .page-numbers {
            display: flex;
            gap: 4px;
        }

        .pagination .page-numbers button {
            min-width: 32px;
            padding: 6px 8px;
        }

        .pagination .page-numbers button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4);
        }

        .pagination .page-numbers .ellipsis {
            padding: 6px 4px;
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .header-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .info-section {
                justify-content: center;
            }

            .pagination {
                justify-content: center;
            }

            .pagination button {
                font-size: 12px;
                padding: 5px 10px;
            }
        }

        /* 图片预览弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 1001;
        }

        .modal-close:hover {
            color: #3498db;
        }

        .modal-download {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            z-index: 1001;
        }

        .modal-download:hover {
            background: #2980b9;
        }

        .modal-info {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1001;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin: 20px 0;
        }

        .empty-icon {
            font-size: 72px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖼️ 火山引擎图片浏览器</h1>
        <div class="header-controls">
            <div class="info-section">
                <div class="info" id="info">加载中...</div>
                <div class="page-size-selector">
                    <label for="pageSize">每页显示:</label>
                    <input type="number" id="pageSize" value="50" min="1" max="100" />
                    <span>张</span>
                </div>
            </div>
            <div class="pagination" id="headerPagination">
                <!-- 分页控件将动态生成 -->
            </div>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>正在加载图片...</div>
            </div>
        </div>
    </div>

    <!-- 图片预览弹窗 -->
    <div id="imageModal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div class="modal-info" id="modalInfo"></div>
        <img class="modal-content" id="modalImage">
        <button class="modal-download" id="downloadBtn">📥 下载图片</button>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentImageKey = '';
        let currentImageUrl = '';

        // 获取当前每页显示数量
        function getPageSize() {
            const input = document.getElementById('pageSize');
            let value = parseInt(input.value) || 50;
            // 限制范围在1-100
            value = Math.max(1, Math.min(100, value));
            input.value = value;
            return value;
        }

        // 页面加载时获取图片
        window.onload = function() {
            loadImages(1);

            // 监听每页数量变化
            const pageSizeInput = document.getElementById('pageSize');
            let debounceTimer;

            pageSizeInput.addEventListener('change', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    loadImages(1); // 修改每页数量后回到第一页
                }, 300);
            });

            pageSizeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loadImages(1);
                }
            });
        };

        // 加载图片列表
        async function loadImages(page) {
            try {
                const pageSize = getPageSize();
                const content = document.getElementById('content');
                content.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>正在加载第 ${page} 页...</div>
                    </div>
                `;

                const response = await fetch(`/api/images?page=${page}&page_size=${pageSize}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error);
                }

                const { images, pagination } = result.data;
                currentPage = pagination.current_page;
                totalPages = pagination.total_pages;

                // 更新信息栏和分页控件
                document.getElementById('info').textContent =
                    `共 ${pagination.total} 张图片 | 第 ${currentPage}/${totalPages} 页`;

                // 在页眉显示分页控件
                document.getElementById('headerPagination').innerHTML = renderPagination(pagination);

                if (images.length === 0) {
                    content.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">📭</div>
                            <div>暂无图片</div>
                        </div>
                    `;
                    return;
                }

                // 渲染图片网格
                let html = '<div class="image-grid">';
                images.forEach(img => {
                    const fileName = img.key.split('/').pop();
                    html += `
                        <div class="image-item" onclick="openModal('${img.key}', '${img.url}', '${fileName}')">
                            <img src="${img.url}" alt="${fileName}" loading="lazy">
                            <div class="image-name">${fileName}</div>
                        </div>
                    `;
                });
                html += '</div>';

                content.innerHTML = html;

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ 加载失败: ${error.message}
                    </div>
                `;
                document.getElementById('headerPagination').innerHTML = '';
            }
        }

        // 渲染分页控件
        function renderPagination(pagination) {
            const { current_page, total_pages, has_prev, has_next } = pagination;

            let html = '';

            // 上一页按钮
            html += `<button onclick="loadImages(${current_page - 1})" ${!has_prev ? 'disabled' : ''}>◀</button>`;

            // 页码按钮
            html += '<div class="page-numbers">';

            // 计算显示的页码范围
            let startPage = Math.max(1, current_page - 2);
            let endPage = Math.min(total_pages, current_page + 2);

            // 第一页
            if (startPage > 1) {
                html += `<button onclick="loadImages(1)">1</button>`;
                if (startPage > 2) {
                    html += `<span class="ellipsis">...</span>`;
                }
            }

            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="loadImages(${i})" class="${i === current_page ? 'active' : ''}">${i}</button>`;
            }

            // 最后一页
            if (endPage < total_pages) {
                if (endPage < total_pages - 1) {
                    html += `<span class="ellipsis">...</span>`;
                }
                html += `<button onclick="loadImages(${total_pages})">${total_pages}</button>`;
            }

            html += '</div>';

            // 下一页按钮
            html += `<button onclick="loadImages(${current_page + 1})" ${!has_next ? 'disabled' : ''}>▶</button>`;

            return html;
        }

        // 打开图片预览
        function openModal(key, url, fileName) {
            currentImageKey = key;
            currentImageUrl = url;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalInfo = document.getElementById('modalInfo');

            modal.classList.add('show');
            modalImg.src = url;
            modalInfo.textContent = fileName;
        }

        // 关闭图片预览
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
        }

        // 点击背景关闭
        document.getElementById('imageModal').onclick = function(event) {
            if (event.target === this) {
                closeModal();
            }
        };

        // ESC键关闭
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // 下载图片
        document.getElementById('downloadBtn').onclick = function(event) {
            event.stopPropagation();

            try {
                // 直接使用图片URL下载
                const a = document.createElement('a');
                a.href = currentImageUrl;
                a.download = currentImageKey.split('/').pop();
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (error) {
                alert('下载失败: ' + error.message);
            }
        };
    </script>
</body>
</html>
