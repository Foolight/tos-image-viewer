<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火山引擎图片浏览器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 300px;
        }

        .header h1 {
            font-size: 18px;
            color: #fff;
            margin: 0;
            white-space: nowrap;
            font-weight: 600;
        }

        .info-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header .info {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .page-size-selector label {
            font-weight: 500;
        }

        .page-size-selector input {
            width: 50px;
            padding: 3px 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            transition: all 0.2s;
            color: #333;
            font-weight: 600;
        }

        .page-size-selector input:focus {
            outline: none;
            border-color: #fff;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            width: 100%;
        }

        .container.align-top {
            align-items: flex-start;
        }

        #content {
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 15px;
            color: #666;
            font-weight: 500;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 5px solid rgba(102, 126, 234, 0.1);
            border-top: 5px solid #667eea;
            border-right: 5px solid #764ba2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #e74c3c;
            font-size: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.1);
            margin: 20px auto;
            max-width: 600px;
        }

        .image-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-min-size, 180px), 1fr));
            width: 100%;
            justify-items: center;
        }

        /* 根据实际图片数量自动调整网格大小 */
        /* 单张图片：超大显示，填满页面 */
        .image-grid[data-size="single"] {
            --grid-min-size: min(95vw, 1600px);
            gap: 0;
            justify-content: center;
            max-width: 1800px;
            margin: 0 auto;
        }

        .image-grid[data-size="single"] .image-item {
            width: 100%;
        }

        /* 2-3张：很大 */
        .image-grid[data-size="xlarge"] {
            --grid-min-size: 550px;
            gap: 20px;
            justify-content: center;
            max-width: 1600px;
            margin: 0 auto;
        }

        .image-grid[data-size="xlarge"] .image-item {
            width: 100%;
            max-width: 800px;
        }

        /* 4-6张：大 */
        .image-grid[data-size="large"] {
            --grid-min-size: 400px;
            gap: 18px;
            justify-content: center;
        }

        .image-grid[data-size="large"] .image-item {
            width: 100%;
            max-width: 650px;
        }

        /* 7-12张：中大 */
        .image-grid[data-size="medium-large"] {
            --grid-min-size: 300px;
            gap: 15px;
        }

        .image-grid[data-size="medium-large"] .image-item {
            width: 100%;
            max-width: 500px;
        }

        /* 13-30张：中等 */
        .image-grid[data-size="medium"] {
            --grid-min-size: 240px;
            gap: 12px;
        }

        .image-grid[data-size="medium"] .image-item {
            width: 100%;
        }

        /* 31-60张：中小 */
        .image-grid[data-size="medium-small"] {
            --grid-min-size: 200px;
            gap: 10px;
        }

        .image-grid[data-size="medium-small"] .image-item {
            width: 100%;
        }

        /* 60+张：小 */
        .image-grid[data-size="small"] {
            --grid-min-size: 160px;
            gap: 10px;
        }

        .image-grid[data-size="small"] .image-item {
            width: 100%;
        }

        @media (max-width: 1200px) {
            .image-grid[data-size="single"] {
                --grid-min-size: 92vw;
            }

            .image-grid[data-size="xlarge"] {
                --grid-min-size: 480px;
            }

            .image-grid[data-size="xlarge"] .image-item {
                max-width: 650px;
            }

            .image-grid[data-size="large"] {
                --grid-min-size: 350px;
            }

            .image-grid[data-size="large"] .image-item {
                max-width: 500px;
            }
        }

        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(var(--grid-min-size, 140px), 1fr));
                gap: 8px;
            }

            .image-grid[data-size="single"] {
                --grid-min-size: 96vw;
                gap: 0;
            }

            .image-grid[data-size="single"] .image-item {
                min-height: 250px;
                max-height: calc(100vh - 120px);
            }

            .image-grid[data-size="single"] .image-item img {
                max-height: calc(100vh - 120px);
            }

            .image-grid[data-size="xlarge"] {
                --grid-min-size: 85vw;
                gap: 12px;
            }

            .image-grid[data-size="xlarge"] .image-item {
                max-width: 95vw;
            }

            .image-grid[data-size="large"] {
                --grid-min-size: 280px;
                gap: 10px;
            }

            .image-grid[data-size="large"] .image-item {
                max-width: none;
            }

            .image-grid[data-size="medium-large"] {
                --grid-min-size: 220px;
                gap: 10px;
            }

            .image-grid[data-size="medium-large"] .image-item {
                max-width: none;
            }

            .image-grid[data-size="medium"] {
                --grid-min-size: 180px;
                gap: 8px;
            }

            .image-grid[data-size="medium-small"] {
                --grid-min-size: 150px;
                gap: 8px;
            }

            .image-grid[data-size="small"] {
                --grid-min-size: 130px;
                gap: 6px;
            }

            .container {
                padding: 6px;
            }
        }

        .image-item {
            position: relative;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 单张图片时的特殊样式 */
        .image-grid[data-size="single"] .image-item {
            aspect-ratio: auto;
            max-height: calc(100vh - 150px);
            min-height: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-grid[data-size="single"] .image-item img {
            object-fit: contain;
            max-height: calc(100vh - 150px);
            width: auto;
            height: auto;
        }

        /* 2-3张图片时的特殊样式 */
        .image-grid[data-size="xlarge"] .image-item {
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .image-item:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
        }

        .image-grid[data-size="single"] .image-item:hover {
            transform: translateY(-4px) scale(1.01);
        }

        .image-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }

        .image-item:hover::before {
            opacity: 1;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 0;
        }

        .image-item .image-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 80%, transparent 100%);
            color: #fff;
            padding: 12px 10px 10px;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2;
            font-weight: 500;
        }

        .image-item:hover .image-name {
            opacity: 1;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
        }

        .pagination button {
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination .page-numbers {
            display: flex;
            gap: 3px;
        }

        .pagination .page-numbers button {
            min-width: 28px;
            padding: 4px 8px;
        }

        .pagination .page-numbers button.active {
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            border-color: transparent;
            font-weight: 700;
        }

        .pagination .page-numbers .ellipsis {
            padding: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        @media (max-width: 1024px) {
            .header-container {
                gap: 10px;
            }

            .header-left {
                min-width: 250px;
            }

            .header h1 {
                font-size: 16px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 6px 8px;
            }

            .header-container {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }

            .header-left {
                flex-direction: column;
                align-items: center;
                gap: 8px;
                min-width: auto;
            }

            .info-section {
                justify-content: center;
                flex-wrap: wrap;
            }

            .header-right {
                justify-content: center;
            }

            .pagination button {
                font-size: 11px;
                padding: 4px 8px;
            }

            .pagination .page-numbers button {
                min-width: 24px;
                padding: 3px 6px;
            }

            .container {
                padding: 10px;
            }
        }

        /* 图片预览弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 90vw;
            max-height: calc(100vh - 160px);
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 1001;
        }

        .modal-close:hover {
            color: #3498db;
        }

        .modal-download {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.6);
            z-index: 1002;
            font-weight: 600;
        }

        .modal-download:hover {
            background: #764ba2;
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.7);
        }

        .modal-info {
            position: fixed;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 1002;
            max-width: calc(100vw - 180px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        /* 移动端模态窗口优化 */
        @media (max-width: 768px) {
            .modal.show {
                padding: 60px 10px;
            }

            .modal-content {
                max-width: 96vw;
                max-height: calc(100vh - 120px);
            }

            .modal-close {
                top: 10px;
                right: 15px;
                font-size: 32px;
            }

            .modal-info {
                top: 10px;
                left: 15px;
                font-size: 12px;
                padding: 8px 12px;
                max-width: calc(100vw - 100px);
            }

            .modal-download {
                bottom: 15px;
                padding: 12px 30px;
                font-size: 14px;
            }
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin: 20px auto;
            max-width: 600px;
        }

        .empty-icon {
            font-size: 72px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-container">
            <div class="header-left">
                <h1>🖼️ 火山引擎图片浏览器</h1>
                <div class="info-section">
                    <div class="info" id="info">加载中...</div>
                    <div class="page-size-selector">
                        <label for="pageSize">每页:</label>
                        <input type="number" id="pageSize" value="50" min="1" max="100" />
                        <span>张</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="pagination" id="headerPagination">
                    <!-- 分页控件将动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>正在加载图片...</div>
            </div>
        </div>
    </div>

    <!-- 图片预览弹窗 -->
    <div id="imageModal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div class="modal-info" id="modalInfo"></div>
        <img class="modal-content" id="modalImage">
        <button class="modal-download" id="downloadBtn">📥 下载图片</button>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentImageKey = '';
        let currentImageUrl = '';

        // 获取当前每页显示数量
        function getPageSize() {
            const input = document.getElementById('pageSize');
            let value = parseInt(input.value) || 50;
            // 限制范围在1-100
            value = Math.max(1, Math.min(100, value));
            input.value = value;
            return value;
        }

        // 页面加载时获取图片
        window.onload = function() {
            // 初始状态垂直居中
            document.querySelector('.container').classList.remove('align-top');

            loadImages(1);

            // 监听每页数量变化
            const pageSizeInput = document.getElementById('pageSize');
            let debounceTimer;

            pageSizeInput.addEventListener('change', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    loadImages(1); // 修改每页数量后回到第一页
                }, 300);
            });

            pageSizeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loadImages(1);
                }
            });
        };

        // 加载图片列表
        async function loadImages(page) {
            try {
                const pageSize = getPageSize();
                const content = document.getElementById('content');
                content.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>正在加载第 ${page} 页...</div>
                    </div>
                `;

                const response = await fetch(`/api/images?page=${page}&page_size=${pageSize}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error);
                }

                const { images, pagination } = result.data;
                currentPage = pagination.current_page;
                totalPages = pagination.total_pages;

                // 更新信息栏和分页控件
                document.getElementById('info').textContent =
                    `共 ${pagination.total} 张图片 | 第 ${currentPage}/${totalPages} 页`;

                // 在页眉显示分页控件
                document.getElementById('headerPagination').innerHTML = renderPagination(pagination);

                if (images.length === 0) {
                    content.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">📭</div>
                            <div>暂无图片</div>
                        </div>
                    `;
                    // 空状态时垂直居中
                    document.querySelector('.container').classList.remove('align-top');
                    return;
                }

                // 根据实际显示的图片数量决定网格大小
                const imageCount = images.length;
                let gridSize = 'medium';

                if (imageCount === 1) {
                    gridSize = 'single';        // 单张：超大，填满页面
                } else if (imageCount <= 3) {
                    gridSize = 'xlarge';        // 2-3张：很大
                } else if (imageCount <= 6) {
                    gridSize = 'large';         // 4-6张：大
                } else if (imageCount <= 12) {
                    gridSize = 'medium-large';  // 7-12张：中大
                } else if (imageCount <= 30) {
                    gridSize = 'medium';        // 13-30张：中等
                } else if (imageCount <= 60) {
                    gridSize = 'medium-small';  // 31-60张：中小
                } else {
                    gridSize = 'small';         // 60+张：小
                }

                // 渲染图片网格
                let html = `<div class="image-grid" data-size="${gridSize}">`;
                images.forEach(img => {
                    const fileName = img.key.split('/').pop();
                    html += `
                        <div class="image-item" onclick="openModal('${img.key}', '${img.url}', '${fileName}')">
                            <img src="${img.url}" alt="${fileName}" loading="lazy">
                            <div class="image-name">${fileName}</div>
                        </div>
                    `;
                });
                html += '</div>';

                content.innerHTML = html;

                // 根据图片数量决定容器对齐方式
                const container = document.querySelector('.container');
                if (imageCount > 12) {
                    // 图片较多时，顶部对齐
                    container.classList.add('align-top');
                } else {
                    // 图片较少时，垂直居中
                    container.classList.remove('align-top');
                }

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ 加载失败: ${error.message}
                    </div>
                `;
                document.getElementById('headerPagination').innerHTML = '';
                // 错误状态时垂直居中
                document.querySelector('.container').classList.remove('align-top');
            }
        }

        // 渲染分页控件
        function renderPagination(pagination) {
            const { current_page, total_pages, has_prev, has_next } = pagination;

            let html = '';

            // 上一页按钮
            html += `<button onclick="loadImages(${current_page - 1})" ${!has_prev ? 'disabled' : ''}>◀</button>`;

            // 页码按钮
            html += '<div class="page-numbers">';

            // 计算显示的页码范围
            let startPage = Math.max(1, current_page - 2);
            let endPage = Math.min(total_pages, current_page + 2);

            // 第一页
            if (startPage > 1) {
                html += `<button onclick="loadImages(1)">1</button>`;
                if (startPage > 2) {
                    html += `<span class="ellipsis">...</span>`;
                }
            }

            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="loadImages(${i})" class="${i === current_page ? 'active' : ''}">${i}</button>`;
            }

            // 最后一页
            if (endPage < total_pages) {
                if (endPage < total_pages - 1) {
                    html += `<span class="ellipsis">...</span>`;
                }
                html += `<button onclick="loadImages(${total_pages})">${total_pages}</button>`;
            }

            html += '</div>';

            // 下一页按钮
            html += `<button onclick="loadImages(${current_page + 1})" ${!has_next ? 'disabled' : ''}>▶</button>`;

            return html;
        }

        // 打开图片预览
        function openModal(key, url, fileName) {
            currentImageKey = key;
            currentImageUrl = url;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalInfo = document.getElementById('modalInfo');

            modal.classList.add('show');
            modalImg.src = url;
            modalInfo.textContent = fileName;
        }

        // 关闭图片预览
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
        }

        // 点击背景关闭
        document.getElementById('imageModal').onclick = function(event) {
            if (event.target === this) {
                closeModal();
            }
        };

        // ESC键关闭
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // 下载图片
        document.getElementById('downloadBtn').onclick = function(event) {
            event.stopPropagation();

            try {
                // 直接使用图片URL下载
                const a = document.createElement('a');
                a.href = currentImageUrl;
                a.download = currentImageKey.split('/').pop();
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (error) {
                alert('下载失败: ' + error.message);
            }
        };
    </script>
</body>
</html>
